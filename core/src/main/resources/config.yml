#
# Used for when AdvancedServerList doesn't have a cached player to use for player placeholders.  
# These values are always used when 'disableCache' is enabled below.
#
unknownPlayer:
  #
  # The name to use.
  #
  # Default: Anonymous
  #
  name: "Anonymous"
  #
  # The UUID to use.
  #
  # Default: 606e2ff0-ed77-4842-9d6c-e1d3321c7838 (UUID of MHF_Question).
  #
  uuid: "606e2ff0-ed77-4842-9d6c-e1d3321c7838"

#
# Should the Caching of players be disabled?
#
# When set to true will no player joining the server be cached and saved.
# This will also cause placeholders using a cached player such as ${player name} to ony return the
# default player
#
# Default: false
#
disableCache: false

#
# Should AdvancedServerList check for new versions?
#
# When set to true will AdvancedServerList look for a new update on startup and repeat that check
# every 12 hours after that.
# It uses Modrinth to check for updates.
#
# Default: true
#
checkUpdates: true

#
# Should debug mode be enabled?
#
# Additional messages prefixed with [DEBUG] will be printed in the console when this option is set
# to true.
# Enabling this option is only recommended for when you have problems, or have been told to enable
# it by the plugin developer, as it can otherwise spam your console.
#
# Default: false
#
debug: false

#
# Should the "ASL" ASCI art be displayed on plugin startup?
# Setting this to false will hide the banner.
#
# Default: true
#
printBanner: true

#
# Sets time in minutes for how long dynamically generated Favicons should be cached.
# Lowest possible value is 1.
#
# Local favicons (Those loaded from PNG files in the favicons folder) are unaffected by this.
#
# Default: 1
#
faviconCacheTime: 1

#
# Sets how AdvancedServerList should handle the size and positioning of images for favicons.
# This only affects images with sizes less or more than 64x64 pixels.
#
# Available options:
#
#   - resize: Resizes the image to 64x64 pixels.
#   - center: Doesn't resize the image, but instead tries to center it as good as possible in a
#             64x64 area.
#   - none:   Doesn't resize the image and leaves it positioned at x 0 and y 0 (top-left) of the
#             64x64 area.
#
# Uses resize when any unknown/invalid option is set, or the option is omitted.
#
faviconResizeStrategy: 'resize'

#
# Options to disable while the Maintenance Plugin is present and Maintenance Mode is active.
#
# Should an option be removed from this section will AdvancedServerList continue to set it, as if
# the Maintenance plugin isn't active.
#
disableDuringMaintenance:
  #
  # Disable MOTD modification during Maintenance?
  #
  # Default: true
  #
  motd: true
  #
  # Disable Favicon modification during Maintenance?
  #
  # Default: true
  #
  favicon: true
  #
  # Disable hiding Player Count during Maintenance?
  #
  # Default: true
  #
  hidePlayers: true
  #
  # Disable hiding Player Count Hover during Maintenance?
  #
  # Default: true
  #
  hidePlayersHover: true
  #
  # Disable Player Count Text modification during Maintenance?
  #
  # Default: true
  #
  playerCountText: true
  #
  # Disable Player Count Hover modification during Maintenance?
  #
  # Default: true
  #
  playerCountHover: true
  #
  # Disable Extra Players Feature during Maintenance?
  #
  # Default: true
  #
  extraPlayers: true
  #
  # Disable Max Players Feature during Maintenance?
  #
  # Default: true
  #
  maxPlayers: true
  #
  # Disable Online Players Feature during Maintenance?
  #
  # Default: true
  #
  onlinePlayers: true

#
# Contains settings for how Cached Players should be stored.
#
storage:
  #
  # The Type of Storage used.  
  # Available options:
  #
  # - json:       Default. Stores data to a playercache.json file.
  # - mysql:      Stores data in a MySQL Database.
  # - mariadb:    Stores data in a MariaDB Database. Recommended over MySQL.
  # - postgresql: Stores data in a PostgreSQL Database.
  #
  # Uses JSON if an invalid option has been selected, or the database handler couldn't be setup.
  #
  type: 'json'
  #
  # The URL/IP to connect to for the database.
  # Only used if the storage type is set to anything but json.
  #
  # Default: localhost
  #
  url: 'localhost'
  #
  # The port to use when connecting to the Database.
  # Only used if the storage type is set to anything but json.
  #
  # Common default ports:
  #
  # - MySQL/MariaDB: 3306
  # - PostgreSQL:    5432
  #
  # Default: 3306
  #
  port: 3306
  #
  # The name of the Database to connect to.
  # Only used if the storage type is set to anything but json.
  #
  # Default: playercache
  #
  name: 'playercache'
  #
  # The username to use for the database.
  # Only used if the storage type is set to anything but json.
  #
  # Default: root
  #
  username: 'root'
  #
  # The password to use for the database.
  # Only used if the storage type is set to anything but json.
  #
  # Default: ''
  #
  password: ''
  #
  # Time interval in minutes at which the player cache should be refreshed from the Database.
  # Only used if the storage type is set to anything but json.
  #
  # Cannot be less than 1.
  #
  # Default: 5
  #
  refreshRate: 5

#
# DO NOT EDIT!
#
# The value of this option is used to determine, whether this config requires a migration to be
# performed or not.
# Changing or removing it could result in the config losing previously set values.
#
configVersion: ${plugin.config.version}