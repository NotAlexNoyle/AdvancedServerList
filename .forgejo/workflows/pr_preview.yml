name: Pull Request Preview

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".forgejo/workflows/pr_preview.yml"
      - "docs/**"
      - "properdocs.yml"
      - "preview_domains"
      - "requirements.txt"
  workflow_dispatch:

env:
  RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"

jobs:
  createPreview:
    runs-on: codeberg-small
    env:
      SITE_ORIGIN: "https://${{ forge.event.repository.owner.username }}.preview.codeberg.page"
      SITE_BASEPATH: "/${{ forge.event.repository.name }}@${{ forge.event.number }}/"
    steps:
      - name: "Find Comment"
        id: find-comment
        uses: https://github.com/peter-evans/find-comment@v4
        with:
          issue-number: "${{ github.event.pull_request.number }}"
          body-includes: "<!-- pr-preview -->"
      - name: "Create or update Comment"
        id: comment
        uses: https://github.com/peter-evans/create-or-update-comment@v5
        with:
          body: |-
            ## Pull request Preview
            
            Deploying Site preview for Pull request. Please wait...
            
            <!-- pr-preview -->
          comment-id: "${{ steps.find-comment.outputs.comment-id }}"
          issue-number: "${{ github.event.pull_request.number }}"
          edit-mode: replace
      - name: "Checkout Repository"
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: "Setup Python"
        uses: https://code.forgejo.org/actions/setup-python@v7
        with:
          python-version: 3.x
      - name: "Install Dependencies"
        run: "pip install -r requirements.txt"
      - name: "Build website preview"
        run: "properdocs build"
      - name: "Deploy website preview"
        uses: https://code.forgejo.org/actions/git-pages@v2
        with:
          site: "${{ env.SITE_ORIGIN }}${{ env.SITE_BASEPATH }}"
          token: "${{ forge.token }}"
          source: site/
      - name: "Update Comment (Success)"
        uses: https://github.com/peter-evans/create-or-update-comment@v5
        with:
          body: |-
            ## Pull request Preview
            
            Site preview deployed successfully!

            | Type    | Link                                           |
            |---------|------------------------------------------------|
            | Commit  | ${{ github.event.pull_request.head.sha }}      |
            | Preview | ${{ env.SITE_ORIGIN }}${{ env.SITE_BASEPATH }} |
            | Logs    | ${{ env.RUN_URL }}                             |
            
            <!-- pr-preview -->
          comment-id: "${{ steps.comment.outputs.comment-id }}"
          issue-number: "${{ github.event.pull_request.number }}"
          edit-mode: replace
      - name: "Update Comment (Failure)"
        if: ${{ failure() }}
        uses: https://github.com/peter-evans/create-or-update-comment@v5
        with:
          body: |-
            ## Pull request Preview
            
            Site preview deployment failed!
            Check the Workflow Run Logs for details.

            | Type    | Link                                           |
            |---------|------------------------------------------------|
            | Commit  | ${{ github.event.pull_request.head.sha }}      |
            | Logs    | ${{ env.RUN_URL }}                             |
            
            <!-- pr-preview -->
          comment-id: "${{ steps.comment.outputs.comment-id }}"
          issue-number: "${{ github.event.pull_request.number }}"
          edit-mode: replace