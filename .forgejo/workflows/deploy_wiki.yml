name: "Deploy Wiki"

on:
  push:
    branches:
      - master
    tags-ignore:
      - "**"
    paths:
      - ".forgejo/workflows/deploy_wiki.yml"
      - "docs/**"
      - "domains"
      - "properdocs.yml"
      - "requirements.txt"

jobs:
  deployWiki:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout Repository"
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          token: "${{ secrets.BOT_TOKEN }}"
      - name: "Setup Python 3.x"
        uses: https://code.forgejo.org/actions/setup-python@v6
        with:
          python-version: 3.x
      - name: "Install Dependencies"
        run: "pip install -r requirements.txt"
      - name: "Build Website"
        run: "properdocs build"
      - name: "Deploy Website"
        uses: https://code.forgejo.org/actions/git-pages@v2
        with:
          site: https://asl.andre601.ch
          token: ${{ secrets.FORGEJO_TOKEN }}
          source: site/